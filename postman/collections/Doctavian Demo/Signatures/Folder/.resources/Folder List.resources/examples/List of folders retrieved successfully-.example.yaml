$kind: http-example
name: List of folders retrieved successfully.
request:
  url: "{{baseUrl}}/v1/signatures/folder/list"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: top
      value: "5398"
      disabled: true
      description: Maximum number of folders to return.
    - key: skip
      value: "5398"
      disabled: true
      description: Number of folders to skip in the sorted results.
    - key: sort
      value: string
      disabled: true
      description: Column to sort the results by (e.g., Name).
    - key: order
      value: DESC
      disabled: true
      description: Sort direction (ASC or DESC). (This can only be one of ASC,DESC)
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "folder": [
          {
            "id": "123e4567-e89b-12d3-a456-426614174000",
            "name": "Q3 Financial Contracts"
          }
        ]
      }
order: 1000
