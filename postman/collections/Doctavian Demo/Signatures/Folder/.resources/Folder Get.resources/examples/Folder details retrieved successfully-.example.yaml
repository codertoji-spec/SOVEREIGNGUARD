$kind: http-example
name: Folder details retrieved successfully.
request:
  url: "{{baseUrl}}/v1/signatures/folder/:folderId/get"
  method: GET
  headers:
    Accept: application/json
  pathVariables:
    - key: folderId
      value: string
      description: (Required) The unique identifier (GUID) of the folder to retrieve.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "folder": {
          "id": "123e4567-e89b-12d3-a456-426614174000",
          "name": "Q3 Financial Contracts"
        }
      }
order: 1000
