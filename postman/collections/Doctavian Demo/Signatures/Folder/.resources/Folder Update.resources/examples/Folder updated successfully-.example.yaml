$kind: http-example
name: Folder updated successfully.
request:
  url: "{{baseUrl}}/v1/signatures/folder/:folderId/update"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  pathVariables:
    - key: folderId
      value: string
      description: (Required) The unique identifier (GUID) of the folder to update.
  body:
    type: json
    content: |-
      {
        "folder": {
          "name": "Q3 Financial Contracts (renamed)"
        }
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "folder": {
          "id": "123e4567-e89b-12d3-a456-426614174000",
          "message": "Folder saved."
        }
      }
order: 1000
