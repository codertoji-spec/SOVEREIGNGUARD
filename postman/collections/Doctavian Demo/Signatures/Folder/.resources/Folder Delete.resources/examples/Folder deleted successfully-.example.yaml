$kind: http-example
name: Folder deleted successfully.
request:
  url: "{{baseUrl}}/v1/signatures/folder/:folderId/delete"
  method: DELETE
  headers:
    Accept: application/json
  pathVariables:
    - key: folderId
      value: string
      description: (Required) The unique identifier (GUID) of the folder to delete.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "folder": {
          "id": "123e4567-e89b-12d3-a456-426614174000",
          "message": "Folder deleted."
        }
      }
order: 1000
