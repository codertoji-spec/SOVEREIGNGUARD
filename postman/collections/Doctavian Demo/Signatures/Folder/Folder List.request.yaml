$kind: http-request
description: Retrieves a paginated list of all folders associated with the authenticated user or namespace.
url: "{{baseUrl}}/v1/signatures/folder/list"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: top
    value: "5398"
    disabled: true
    description: Maximum number of folders to return.
  - key: skip
    value: "5398"
    disabled: true
    description: Number of folders to skip in the sorted results.
  - key: sort
    value: string
    disabled: true
    description: Column to sort the results by (e.g., Name).
  - key: order
    value: DESC
    disabled: true
    description: Sort direction (ASC or DESC). (This can only be one of ASC,DESC)
examples: ./.resources/Folder List.resources/examples
order: 4000
