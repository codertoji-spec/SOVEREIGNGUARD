$kind: http-example
name: Comment created; returns the full visible-comment set for the envelope, not just the new comment.
request:
  url: "{{baseUrl}}/v1/signatures/document/:documentId/comment"
  method: POST
  headers:
    - key: X-Origin-IpAddress
      value: string
      disabled: true
      description: Caller IP address, recorded in the audit trail. Not validated.
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
  queryParams:
    - key: tid
      value: 312bb9a2-9a08-1229-d383-fc5a85ee4abe
      disabled: true
      description: Transaction token identifying a specific recipient+envelope pair. Required for anonymous/recipient access (no Authorization header, or the header doesn't resolve to the envelope owner).
  pathVariables:
    - key: documentId
      value: string
      description: (Required) The ID(URN) of the document from the envelope, where you’d like to place a comment.
  body:
    type: json
    content: |-
      {
        "comment": {
          "content": "string",
          "pageNumber": 0,
          "positionX": 0,
          "positionY": 0,
          "parentCommentId": "string",
          "visibleTo": [
            "string"
          ]
        },
        "externalContext": {}
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "statusCode": 201,
          "message": "Created",
          "data": {
            "comments": {}
          }
        },
        "origin": "string",
        "dateTime": "string",
        "externalContext": {}
      }
order: 1000
