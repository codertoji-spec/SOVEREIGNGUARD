$kind: http-request
description: |-
  Downloads a specific document within an envelope.<br />
  * The envelope is identified using the <strong>envelopeId</strong> path parameter.
  * The document is identified using the <strong>documentId</strong> path parameter.
  * The envelope is authenticated via the <strong>transactionId</strong> (tid) query parameter.
  * The document is returned as a binary stream (<strong>application/octet-stream</strong>), typically in its original format (e.g., PDF, DOCX) or as a processed version (e.g., signed PDF).
url: "{{baseUrl}}/v1/signatures/envelope/:envelopeId/document/:documentId/download"
method: GET
headers:
  Accept: application/octet-stream
queryParams:
  - key: tid
    value: 312bb9a2-9a08-1229-d383-fc5a85ee4abe
    disabled: true
    description: Transaction token identifying a specific recipient+envelope pair. Required for anonymous/recipient access (no Authorization header, or the header doesn't resolve to the envelope owner).
pathVariables:
  - key: envelopeId
    value: string
    description: (Required) The ID of the envelope where the attachment is added.
  - key: documentId
    value: string
    description: |+
      (Required) The needed string value.
      The ID(URN) of the document you would like to download from the defined envelope.

examples: ./.resources/Envelope Document Download.resources/examples
order: 6000
