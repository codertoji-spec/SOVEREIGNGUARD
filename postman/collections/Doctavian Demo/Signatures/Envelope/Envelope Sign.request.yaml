$kind: http-request
description: |-
  Signs a sent and opened envelope.<br />
  * The envelope is identified using the <strong>transactionId</strong> (tid) query parameter, typically obtained from the email link sent to the recipient or via the <strong>GET /signatures/envelope/list</strong> endpoint.
  * Field IDs required in the request body can be retrieved from the endpoint that provides details about the open envelope.
  * This endpoint allows recipients to apply signatures and fill required fields (e.g., initials, text, checkboxes) to complete their signing obligations. For an in-person signer, the host must be a logged-in user matching the recipient's hostEmail (`HOST_USER_NOT_MATCHING` otherwise). Returns 202 instead of 200 when the digital-signature flow requires an additional client-side step to complete.
url: "{{baseUrl}}/v1/signatures/envelope/sign"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
queryParams:
  - key: tid
    value: 312bb9a2-9a08-1229-d383-fc5a85ee4abe
    disabled: true
    description: Transaction token identifying a specific recipient+envelope pair. Required for anonymous/recipient access (no Authorization header, or the header doesn't resolve to the envelope owner).
body:
  type: json
  content: |-
    {
      "externalContext": {
        "id": "12345"
      },
      "fields": [
        {
          "id": "{{fieldId}}",
          "value": "{{fieldValue}}"
        }
      ]
    }
examples: ./.resources/Envelope Sign.resources/examples
order: 22000
