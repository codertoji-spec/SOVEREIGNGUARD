$kind: http-request
description: |-
  Terminates the signing process by canceling a sent envelope.<br />
  * The envelope is identified using the <strong>envelopeId</strong> path parameter.
  * Once canceled, the envelope transitions to a final state of <strong>"Canceled"</strong>, preventing any further actions by recipients (e.g., viewing or signing documents).
  * Use this endpoint when a sender needs to stop the process, for example, due to errors in the envelope, changes in requirements, or other reasons. Note: this is a state-mutating operation exposed as GET. It also performs no status-precondition check - it can be called against an envelope in any status, including one already Completed, Deleted, or Canceled.
url: "{{baseUrl}}/v1/signatures/envelope/:envelopeId/cancel"
method: GET
headers:
  - key: X-Origin-IpAddress
    value: string
    disabled: true
    description: Caller IP address, recorded in the audit trail. Not validated.
  - key: Accept
    value: application/json
pathVariables:
  - key: envelopeId
    value: string
    description: (Required) The ID of the envelope which Audit trail is needed.
examples: ./.resources/Envelope Cancel.resources/examples
order: 6000
