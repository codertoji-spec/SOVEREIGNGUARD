$kind: http-request
description: |-
  Removes a specific signature from the Storage system.<br />
  * The signature is identified using the <strong>signatureId</strong> path parameter.
  * This endpoint allows users to delete a previously stored signature associated with their account.
url: "{{baseUrl}}/v1/signatures/signature/:signatureId/delete"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: signatureId
    value: string
    description: (Required) The ID of the signature that should be deleted.
examples: ./.resources/Signature Delete.resources/examples
order: 27000
