$kind: http-example
name: Envelope deleted.
request:
  url: "{{baseUrl}}/v1/signatures/envelope/:envelopeId/delete"
  method: DELETE
  headers:
    Accept: application/json
  pathVariables:
    - key: envelopeId
      value: string
      description: (Required) The ID of the envelope that should be deleted.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "statusCode": 200,
          "message": "OK",
          "data": {
            "envelope": {
              "id": "string",
              "message": "string"
            }
          }
        },
        "origin": "string",
        "dateTime": "string"
      }
order: 1000
