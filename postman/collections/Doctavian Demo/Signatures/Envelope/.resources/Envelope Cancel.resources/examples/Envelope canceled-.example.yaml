$kind: http-example
name: Envelope canceled.
request:
  url: "{{baseUrl}}/v1/signatures/envelope/:envelopeId/cancel"
  method: GET
  headers:
    - key: X-Origin-IpAddress
      value: string
      disabled: true
      description: Caller IP address, recorded in the audit trail. Not validated.
    - key: Accept
      value: application/json
  pathVariables:
    - key: envelopeId
      value: string
      description: (Required) The ID of the envelope which Audit trail is needed.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "statusCode": 200,
          "message": "OK",
          "data": {
            "envelope": {
              "id": "string",
              "message": "string"
            }
          }
        },
        "origin": "string",
        "dateTime": "string"
      }
order: 1000
