$kind: http-example
name: An error occurred. See SignatureErrorResponse for the response shape.
request:
  url: "{{baseUrl}}/v1/signatures/envelope/:envelopeId/cancel"
  method: GET
  headers:
    - key: X-Origin-IpAddress
      value: string
      disabled: true
      description: Caller IP address, recorded in the audit trail. Not validated.
    - key: Accept
      value: application/json
  pathVariables:
    - key: envelopeId
      value: string
      description: (Required) The ID of the envelope which Audit trail is needed.
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "message": "Envelope not found.",
          "statusCode": 400,
          "innerErrors": [
            {
              "code": "ENVELOPE_ID_INVALID",
              "message": "Envelope not found.",
              "userMessage": "Envelope not found."
            }
          ]
        },
        "origin": "POST https://apim-mavenheadless-dev-westeu-1.azure-api.net/v1/signatures/envelope/create",
        "dateTime": "2026-07-20T12:00:00.0000000+00:00"
      }
order: 3000
