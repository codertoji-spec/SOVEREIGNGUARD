$kind: http-example
name: Envelope signed.
request:
  url: "{{baseUrl}}/v1/signatures/envelope/sign"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  queryParams:
    - key: tid
      value: 312bb9a2-9a08-1229-d383-fc5a85ee4abe
      disabled: true
      description: Transaction token identifying a specific recipient+envelope pair. Required for anonymous/recipient access (no Authorization header, or the header doesn't resolve to the envelope owner).
  body:
    type: json
    content: |-
      {
        "externalContext": {
          "id": "12345"
        },
        "fields": [
          {
            "id": "{{fieldId}}",
            "value": "{{fieldValue}}"
          }
        ]
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "statusCode": 200,
          "message": "OK",
          "data": {
            "envelope": {
              "id": "string",
              "message": "string"
            }
          }
        },
        "origin": "string",
        "dateTime": "string"
      }
order: 1000
