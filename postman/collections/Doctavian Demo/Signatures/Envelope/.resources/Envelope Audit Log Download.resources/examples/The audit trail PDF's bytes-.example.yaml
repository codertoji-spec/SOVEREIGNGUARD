$kind: http-example
name: The audit trail PDF's bytes.
request:
  url: "{{baseUrl}}/v1/signatures/envelope/:envelopeId/audit/download"
  method: GET
  headers:
    Accept: application/octet-stream
  pathVariables:
    - key: envelopeId
      value: string
      description: (Required) The ID of the envelope where the attachment will be added.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/octet-stream
  body:
    type: text
    content: ""
order: 1000
