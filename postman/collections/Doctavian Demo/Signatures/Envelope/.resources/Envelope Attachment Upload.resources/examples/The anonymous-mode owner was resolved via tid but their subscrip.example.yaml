$kind: http-example
name: "The anonymous-mode owner was resolved via tid but their subscription is inactive/invalid. Real code: ENVELOPE_OWNER_INVALID_SUBSCRIPTION."
request:
  url: "{{baseUrl}}/v1/signatures/envelope/:envelopeId/attachment/upload"
  method: POST
  headers:
    - key: X-Service-Authorization
      value: ""
      description: Service-to-service auth token, used as an alternative to `Authorization` in authenticated mode.
    - key: X-Client-Authorization
      value: ""
      description: Client auth token, used as an alternative to `Authorization` in authenticated mode.
    - key: X-OAuth-Flow
      value: string
      disabled: true
      description: Indicates which OAuth flow variant issued the Authorization token, in authenticated mode.
    - key: X-Origin
      value: https://app.mavenmule.com
      disabled: true
      description: Free-form caller-supplied origin identifier. Not validated; echoed back verbatim into the response envelope's origin field. Optional.
    - key: X-Storage-Type
      value: envelope-attachment
      description: (Required) Container-type key for the uploaded attachment. Expected value is `envelope-attachment`.
    - key: Content-Type
      value: multipart/form-data
    - key: Accept
      value: application/json
  queryParams:
    - key: tid
      value: 312bb9a2-9a08-1229-d383-fc5a85ee4abe
      disabled: true
      description: Transaction token identifying a specific recipient+envelope pair. When present and Guid-parseable, selects anonymous mode and no Authorization header is required. When absent or not Guid-parseable, authenticated mode applies and Authorization is required instead.
  pathVariables:
    - key: envelopeId
      value: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      description: (Required) GUID of the envelope to attach the file(s) to.
  body:
    type: formdata
    content:
      - type: text
        key: file
        value: ""
        description: (Required) One or more attachment files to upload. No extension or content-type validation is performed — any file type is accepted. Order is preserved in the response.
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "statusCode": 403,
          "message": "The envelope owner's subscription is not active.",
          "innerErrors": [
            {
              "code": "ENVELOPE_OWNER_INVALID_SUBSCRIPTION",
              "message": "The envelope owner's subscription is not active.",
              "userMessage": "This envelope can't accept uploads right now."
            }
          ]
        },
        "origin": "https://app.mavenmule.com",
        "dateTime": "2026-07-14T09:32:15.0000000+00:00",
        "operationId": "3a4b5c6d7e8f90112233445566778899"
      }
order: 4000
