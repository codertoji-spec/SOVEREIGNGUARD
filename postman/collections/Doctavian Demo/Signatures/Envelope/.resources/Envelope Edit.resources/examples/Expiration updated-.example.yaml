$kind: http-example
name: Expiration updated.
request:
  url: "{{baseUrl}}/v1/signatures/envelope/:envelopeId/edit"
  method: PUT
  headers:
    - key: X-Origin-IpAddress
      value: string
      disabled: true
      description: Caller IP address, recorded in the audit trail. Not validated.
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
  pathVariables:
    - key: envelopeId
      value: string
      description: (Required) The envelopeId parameter in the URL is a unique identifier for the envelope whose notification settings are being edited. It specifies which already-sent envelope should be updated with the new expiration and alert configurations.
  body:
    type: json
    content: |-
      {
        "envelope": {
          "expireInDays": 7,
          "alertDaysBeforeExpiry": 3
        },
        "externalContext": {
          "id": "12345"
        }
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "result": {
          "statusCode": 200,
          "message": "OK",
          "data": {
            "envelope": {
              "id": "string",
              "message": "string"
            }
          }
        },
        "origin": "string",
        "dateTime": "string"
      }
order: 1000
