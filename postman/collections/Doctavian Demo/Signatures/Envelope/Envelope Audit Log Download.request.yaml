$kind: http-request
description: |-
  Retrieves the audit trail for a specific envelope as a downloadable file.<br />
  * The file provides a formal record of the envelope’s lifecycle for compliance, auditing, or record-keeping purposes.
  * The envelope is identified using the <strong>envelopeId</strong> path parameter.
  * The request returns the audit trail as a binary stream (<strong>application/octet-stream</strong>). Response is NOT wrapped in the standard result envelope - raw PDF bytes are returned directly, but with Content-Type application/octet-stream (not application/pdf) as actually set by the server.
url: "{{baseUrl}}/v1/signatures/envelope/:envelopeId/audit/download"
method: GET
headers:
  Accept: application/octet-stream
pathVariables:
  - key: envelopeId
    value: string
    description: (Required) The ID of the envelope where the attachment will be added.
examples: ./.resources/Envelope Audit Log Download.resources/examples
order: 4000
