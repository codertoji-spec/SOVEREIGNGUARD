$kind: http-example
name: This response indicates that the signature identified by the provided signatureId was successfully deleted.
request:
  url: "{{baseUrl}}/v1/signatures/signature/:signatureId/delete"
  method: DELETE
  headers:
    Accept: application/json
  pathVariables:
    - key: signatureId
      value: string
      description: (Required) The ID of the signature that should be deleted.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "signature": {
          "id": "123e4567-e89b-12d3-a456-426614174000",
          "message": "Signature deleted."
        }
      }
order: 1000
