$kind: http-example
name: This is the response returned when the signature is successfully updated.
request:
  url: "{{baseUrl}}/v1/signatures/signature/:signatureId/update"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  pathVariables:
    - key: signatureId
      value: string
      description: (Required) The ID of the signature that should be updated.
  body:
    type: json
    content: |-
      {
        "signature": {
          "value": "data:image/png;base64,iVBORw0KGgo...",
          "isDefault": false
        }
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "signature": {
          "id": "123e4567-e89b-12d3-a456-426614174000",
          "message": "Signature saved."
        }
      }
order: 1000
