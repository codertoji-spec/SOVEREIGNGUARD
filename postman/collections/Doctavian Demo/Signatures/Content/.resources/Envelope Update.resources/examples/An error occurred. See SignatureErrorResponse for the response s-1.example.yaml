$kind: http-example
name: An error occurred. See SignatureErrorResponse for the response shape.
request:
  url: "{{baseUrl}}/v1/signatures/envelope/:envelopeId/update"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  pathVariables:
    - key: envelopeId
      value: string
      description: (Required) The unique identifier of the envelope to be updated. This ID is generated when the envelope is first created and is used to reference and modify the envelope before it is sent to recipients. It must match an existing envelope that is still in a draft (unsent) status.
  body:
    type: json
    content: |-
      {
        "documents": [
          {
            "referenceDocumentId": 1,
            "name": "Test Document Name",
            "loadMethod": "Storage",
            "urn": "{{uploadedDocument}}"
          }
        ],
        "recipients": [
          {
            "referenceSignerId": 1,
            "name": "Test Example",
            "email": "user@example.com",
            "role": "signer",
            "mandatory": true
          }
        ],
        "fields": [
          {
            "type": "signature",
            "isRequired": true,
            "referenceSignerId": 1,
            "referenceDocumentId": 1,
            "positionX": 10,
            "positionY": 10,
            "height": 100,
            "width": 100,
            "page": 1,
            "name": "mds_signature1",
            "properties": {
              "fontFamily": "Arial",
              "fontSize": 13,
              "color": "red",
              "bold": true,
              "italic": true,
              "underline": true,
              "textAlign": "center"
            }
          }
        ],
        "envelope": {
          "subject": "Email Subject",
          "message": "Email Message",
          "senderName": "Sender",
          "senderEmail": "sender@example.com",
          "isSignOrder": false,
          "expireInDays": 5,
          "alertDaysBeforeExpiry": 5,
          "firstReminderDays": 3,
          "repeatingReminderDays": 2,
          "notifyWhenOpened": true,
          "notifyWhenSigned": true
        },
        "externalContext": {
          "id": "12345"
        }
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "message": "Envelope not found.",
          "statusCode": 400,
          "innerErrors": [
            {
              "code": "ENVELOPE_ID_INVALID",
              "message": "Envelope not found.",
              "userMessage": "Envelope not found."
            }
          ]
        },
        "origin": "POST https://apim-mavenheadless-dev-westeu-1.azure-api.net/v1/signatures/envelope/create",
        "dateTime": "2026-07-20T12:00:00.0000000+00:00"
      }
order: 3000
