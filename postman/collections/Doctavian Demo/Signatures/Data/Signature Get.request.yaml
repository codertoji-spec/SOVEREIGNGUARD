$kind: http-request
description: |-
  Retrieves details about a specific signature stored in the system.<br />
  * The signature is identified using the <strong>signatureId</strong> path parameter.
  * The endpoint returns the signature and its associated metadata in JSON format.
url: "{{baseUrl}}/v1/signatures/signature/:signatureId/get"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: signatureId
    value: string
    description: (Required) The ID of the signature which information should be retrieved.
examples: ./.resources/Signature Get.resources/examples
order: 2000
