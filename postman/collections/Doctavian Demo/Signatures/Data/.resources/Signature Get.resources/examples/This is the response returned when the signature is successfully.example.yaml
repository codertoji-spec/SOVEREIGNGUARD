$kind: http-example
name: |-
  This is the response returned when the signature is successfully retrieved.<br />
  The response includes all the needed signature data.
request:
  url: "{{baseUrl}}/v1/signatures/signature/:signatureId/get"
  method: GET
  headers:
    Accept: application/json
  pathVariables:
    - key: signatureId
      value: string
      description: (Required) The ID of the signature which information should be retrieved.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "signature": {
          "id": "123e4567-e89b-12d3-a456-426614174000",
          "data": "data:image/png;base64,iVBORw0KGgo...",
          "isDefault": true
        }
      }
order: 1000
