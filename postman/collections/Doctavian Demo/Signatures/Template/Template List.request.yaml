$kind: http-request
description: |-
  Retrieves a list of all templates associated with the authenticated user.<br />
  * Supports filtering, sorting, and pagination via query parameters.
  * <strong>Query Parameters:</strong>
    * <strong>top</strong> (integer). Maximum number of templates to return (e.g., 25).
    * <strong>skip</strong> (integer). Number of templates to skip in the sorted results (e.g., 0).
    * <strong>sort</strong> (string). Column to sort by. Valid values: <i>Template Name, Template Roles, Documents, Creation Date</i>.
    * <strong>order</strong> (string). Sort direction. Valid values: <i>ASC, DESC</i>.
    * <strong>filter</strong> (JSON array). List of filter objects to refine results. Each filter includes:
      * <strong>column</strong> (string). Field to filter on (matches sort values).
      * <strong>condition</strong> (string). Filter condition. 
        * For stringFilter: <i>EMPTY, NOT_EMPTY, CONTAINS, CONTAINS_CASE_SENSITIVE, DOES_NOT_CONTAIN, DOES_NOT_CONTAIN_CASE_SENSITIVE, STARTS_WITH, STARTS_WITH_CASE_SENSITIVE, ENDS_WITH, ENDS_WITH_CASE_SENSITIVE, EQUAL, EQUAL_CASE_SENSITIVE, NULL, NOT_NULL.</i>
        * For dateFilter: <i>EQUAL, NOT_EQUAL, LESS_THAN, LESS_THAN_OR_EQUAL, GREATER_THAN, GREATER_THAN_OR_EQUAL, NULL, NOT_NULL</i>.
      * <strong>value</strong> (string). Filter value.
        * string for stringFilter.
        * YYYY-MM-DD for dateFilter.
      * <strong>type</strong> (string): 
        * stringFilter.
        * dateFilter.
      * <strong>key</strong> (string). Unique 12-character alphanumeric identifier for the filter.
url: "{{baseUrl}}/v1/signatures/template/list"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: sort
    value: Template Roles
    disabled: true
    description: Column to sort by the results. (This can only be one of Template Name,Template Roles,Documents,Creation Date)
  - key: order
    value: DESC
    disabled: true
    description: The direction of the sort. (This can only be one of ASC,DESC)
  - key: top
    value: "100"
    disabled: true
    description: Max rows to return.
  - key: skip
    value: "0"
    disabled: true
    description: Rows to skip. Defaults to 0 if omitted or not a valid integer.
  - key: orderby
    value: string
    disabled: true
    description: Single combined param, format "<column>|<ASC|DESC>" (literal pipe). Defaults to `UploadDate DESC` if omitted or not recognized.
  - key: filter
    value: string
    disabled: true
    description: URL-encoded JSON array of FilterInput objects. A folder-scoping filter (key="folder") can be used with the value "templates" to scope results to templates.
examples: ./.resources/Template List.resources/examples
order: 6000
