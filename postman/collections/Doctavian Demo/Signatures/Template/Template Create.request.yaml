$kind: http-request
description: |-
  Creates a template containing one or more documents, template roles, and recipient roles.<br />
  * The created template is assigned a unique ID, stored in the <strong>templateId</strong> parameter.
  * Documents must first be uploaded via the Storage endpoint and linked to recipients using <strong>referenceDocumentId</strong> and <strong>referenceSignerId.</strong>
  * Template roles act as placeholders for actual recipients, which are defined when the template is used to create an envelope.
  * Recipient roles define the required actions for each recipient. Note: templateName is the only field the server actually requires (TEMPLATE_NAME_REQUIRED) - documents/recipients/fields may all be empty.
url: "{{baseUrl}}/v1/signatures/template/create"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "documents": [
        {
          "referenceDocumentId": 0,
          "name": "string",
          "loadMethod": "string",
          "urn": "string",
          "externalContext": {}
        }
      ],
      "fields": [
        {
          "referenceSignerId": 0,
          "referenceSignGroupId": 0,
          "referenceDocumentId": 0,
          "name": "string",
          "value": "string",
          "type": "signature",
          "anchorString": "string",
          "page": 0,
          "height": 0,
          "width": 0,
          "positionX": 0,
          "positionY": 0,
          "isRequired": true,
          "tooltip": "string",
          "properties": {
            "fontFamily": "string",
            "fontSize": 0,
            "color": "string",
            "bold": true,
            "italic": true,
            "underline": true,
            "textAlign": "string",
            "placeholder": "string",
            "isSignedDate": true,
            "selectionGroup": "string",
            "selectionValue": "string"
          }
        }
      ],
      "recipients": [
        {
          "referenceSignerId": 0,
          "referenceSignGroupId": 0,
          "name": "string",
          "email": "string",
          "role": "signer",
          "templateRole": "string",
          "signOrder": 0,
          "mandatory": true,
          "hostEmail": "string",
          "isMfaEnabled": true,
          "phoneNumber": "string",
          "externalContext": {}
        }
      ],
      "signGroups": [
        {
          "referenceSignGroupId": 0,
          "name": "string",
          "role": "signer",
          "signOrder": 0,
          "mandatory": true,
          "templateRole": "string"
        }
      ],
      "template": {
        "subject": "string",
        "message": "string",
        "senderName": "string",
        "senderEmail": "string",
        "isSignOrder": true,
        "expireInDays": 0,
        "alertDaysBeforeExpiry": 0,
        "firstReminderDays": 0,
        "repeatingReminderDays": 0,
        "notifyWhenOpened": true,
        "notifyWhenSigned": true,
        "templateName": "string",
        "templateDescription": "string",
        "folderId": "string",
        "locale": "string",
        "timezone": "string"
      },
      "externalContext": {}
    }
examples: ./.resources/Template Create.resources/examples
order: 2000
