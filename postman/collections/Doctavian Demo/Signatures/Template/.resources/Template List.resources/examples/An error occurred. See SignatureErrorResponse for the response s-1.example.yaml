$kind: http-example
name: An error occurred. See SignatureErrorResponse for the response shape.
request:
  url: "{{baseUrl}}/v1/signatures/template/list"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: sort
      value: Template Roles
      disabled: true
      description: Column to sort by the results. (This can only be one of Template Name,Template Roles,Documents,Creation Date)
    - key: order
      value: DESC
      disabled: true
      description: The direction of the sort. (This can only be one of ASC,DESC)
    - key: top
      value: "100"
      disabled: true
      description: Max rows to return.
    - key: skip
      value: "0"
      disabled: true
      description: Rows to skip. Defaults to 0 if omitted or not a valid integer.
    - key: orderby
      value: string
      disabled: true
      description: Single combined param, format "<column>|<ASC|DESC>" (literal pipe). Defaults to `UploadDate DESC` if omitted or not recognized.
    - key: filter
      value: string
      disabled: true
      description: URL-encoded JSON array of FilterInput objects. A folder-scoping filter (key="folder") can be used with the value "templates" to scope results to templates.
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "message": "Envelope not found.",
          "statusCode": 400,
          "innerErrors": [
            {
              "code": "ENVELOPE_ID_INVALID",
              "message": "Envelope not found.",
              "userMessage": "Envelope not found."
            }
          ]
        },
        "origin": "POST https://apim-mavenheadless-dev-westeu-1.azure-api.net/v1/signatures/envelope/create",
        "dateTime": "2026-07-20T12:00:00.0000000+00:00"
      }
order: 3000
