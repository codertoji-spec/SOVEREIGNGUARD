$kind: http-request
description: |-
  Updates an existing template that has been created but not yet used to send an envelope.<br />
  * The template is identified using the <strong>templateId</strong> parameter.
  * This endpoint allows modification of:
    * Template information.
    * Included documents.
    * Assigned recipients.
    * Added fields.
    * Expiration settings.
    * Reminder settings.
    * Associated metadata.
url: "{{baseUrl}}/v1/signatures/template/:templateId/update"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: templateId
    value: string
    description: (Required) The ID of the template that should be edited.
body:
  type: json
  content: |-
