$kind: http-example
name: Unexpected server error. `eventId` correlates to server logs.
request:
  url: "{{baseUrl}}/v1/documents/configuration/:documentSolutionConfigurationGuid/get"
  method: GET
  headers:
    Accept: application/json
  pathVariables:
    - key: documentSolutionConfigurationGuid
      value: a3bb189e-8bf9-3888-9912-ace4e6543002
      description: (Required) GUID of the document solution configuration.
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "GET_DATA_SOURCE_ERROR",
        "message": "An unexpected error occurred.",
        "eventId": "a1b2c3d4"
      }
order: 5000
