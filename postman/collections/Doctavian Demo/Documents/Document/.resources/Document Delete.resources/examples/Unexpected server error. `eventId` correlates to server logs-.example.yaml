$kind: http-example
name: Unexpected server error. `eventId` correlates to server logs.
request:
  url: "{{baseUrl}}/v1/documents/document/:documentGuid/delete"
  method: DELETE
  headers:
    Accept: application/json
  pathVariables:
    - key: documentGuid
      value: 16fd2706-8baf-433b-82eb-8c7fada847da
      description: (Required) GUID of the document to delete.
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "GET_DATA_SOURCE_ERROR",
        "message": "An unexpected error occurred.",
        "eventId": "a1b2c3d4"
      }
order: 5000
