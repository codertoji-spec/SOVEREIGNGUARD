$kind: http-request
description: |-
  This is an object representing a document request in the system. You can use this endpoint to generate documents (e.g. PDF, DOCX, XLSX) by specifying a template, providing the data to populate that template, and choosing where and how the final file should be delivered. <br />

  The document output can be stored in Storage, Salesforce, or OneDrive, and may include advanced options like anonymous sharing, file ownership, and metadata tagging. <br />

  You can also attach additional related templates, pass custom variables, and render dynamic content using GraphQL queries or stored data sources. <br />

  Related guide: [Document Template Configuration](https://docs.mavenmule.com/maven-documents/elements-reference)
url: "{{baseUrl}}/v1/documents/document/generate"
method: POST
headers:
  - key: X-Client-Authorization
    value: ""
    description: |-
      Encrypted (AES) JWT token to identify and authorize the calling client system responsible for requesting the document generation. This header is required when retrieving the template and/or data used to populate the template from the client’s side, and for delivering the final generated document on the client’s side. The JWT must contain the following claims:<br /><br />
      **<i>sub</i>**: Current user session.<br />
      **<i>Destination</i>**: Path to which should be used to make a callback.<br />
      **<i>full_name</i>**: Name of the user that made the request.<br />
      **<i>email</i>**: The email address of the user that made the request.<br />
      **<i>iss</i>**: The issuer claim identifies the principal that issued the JWT. URL of the issuer.<br />
      **<i>oid</i>**: Object Id claim represents a unique Id of the user that made the request, for example in Salesforce case this will be User record Id.<br />
      **<i>clientId</i>**: Id representing the client. Eg OrgId.<br />
      **<i>zoneInfo</i>**: Zone information.<br />
      **<i>locale</i>**: Localization information.
  - key: X-Service-Authorization
    value: ""
    description: |-
      Encrypted (AES) JWT token to represent a user that doesn’t have a Microsoft Account and that is allowed to use the subscription. The JWT must contain the following claims:<br /><br />
      **<i>amp_subscription</i>**: The offering subscription key which is used to validate that the client has a valid license.<br />
      **<i>full_name</i>**: Name of the user that made the request.<br />
      **<i>email</i>**: The email address of the user that made the request.<br />
      **<i>iss</i>**: The issuer claim identifies the principal that issued the JWT. URL of the issuer.<br />
      **<i>oid</i>**: Object Id claim represents a unique Id of the user that made the request, for example in Salesforce case this will be User record Id.<br />
      **<i>zoneInfo</i>**: Zone information.<br />
      **<i>locale</i>**: Localization information.
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
