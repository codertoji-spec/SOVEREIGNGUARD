$kind: http-example
name: Unexpected server error. `eventId` correlates to server logs.
request:
  url: "{{baseUrl}}/v1/documents/option/:entityType/:entityId/replace"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  pathVariables:
    - key: entityType
      value: DocumentSolutionConfiguration
      description: (Required) Type of the owning entity, e.g. "DocumentSolutionConfiguration" or "DocumentTemplate".
    - key: entityId
      value: a3bb189e-8bf9-3888-9912-ace4e6543002
      description: (Required) GUID of the owning entity.
  body:
    type: json
    content: |-
      [
        {
          "customKey": "watermark.text",
          "customGroup": "rendering",
          "value": "CONFIDENTIAL"
        },
        {
          "optionDefinitionId": 42,
          "value": "true"
        }
      ]
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "GET_DATA_SOURCE_ERROR",
        "message": "An unexpected error occurred.",
        "eventId": "a1b2c3d4"
      }
order: 5000
