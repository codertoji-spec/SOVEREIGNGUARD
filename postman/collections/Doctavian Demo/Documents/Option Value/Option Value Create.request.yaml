$kind: http-request
description: Creates one option value for the entity named in the path. Provide EITHER `optionDefinitionId` (system option) OR `customKey` (custom option), never both.
url: "{{baseUrl}}/v1/documents/option/:entityType/:entityId/create"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: entityType
    value: DocumentSolutionConfiguration
    description: (Required) Type of the owning entity, e.g. "DocumentSolutionConfiguration" or "DocumentTemplate".
  - key: entityId
    value: a3bb189e-8bf9-3888-9912-ace4e6543002
    description: (Required) GUID of the owning entity.
body:
  type: json
  content: |-
    {
      "customKey": "watermark.text",
      "customGroup": "rendering",
      "value": "CONFIDENTIAL"
    }
examples: ./.resources/Option Value Create.resources/examples
order: 1000
