$kind: http-request
description: Returns all option values attached to the entity named in the path. This endpoint does not paginate.
url: "{{baseUrl}}/v1/documents/option/:entityType/:entityId/list"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: entityType
    value: DocumentSolutionConfiguration
    description: (Required) Type of the owning entity, e.g. "DocumentSolutionConfiguration" or "DocumentTemplate".
  - key: entityId
    value: a3bb189e-8bf9-3888-9912-ace4e6543002
    description: (Required) GUID of the owning entity.
examples: ./.resources/Option Value List.resources/examples
order: 4000
