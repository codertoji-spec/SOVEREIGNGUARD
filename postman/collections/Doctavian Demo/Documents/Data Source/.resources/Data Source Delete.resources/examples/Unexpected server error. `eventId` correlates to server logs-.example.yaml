$kind: http-example
name: Unexpected server error. `eventId` correlates to server logs.
request:
  url: "{{baseUrl}}/v1/documents/datasource/:dataSourceGuid/delete"
  method: DELETE
  headers:
    Accept: application/json
  pathVariables:
    - key: dataSourceGuid
      value: 3f2504e0-4f89-41d3-9a0c-0305e82c3301
      description: (Required) GUID of the data source to delete.
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "GET_DATA_SOURCE_ERROR",
        "message": "An unexpected error occurred.",
        "eventId": "a1b2c3d4"
      }
order: 5000
