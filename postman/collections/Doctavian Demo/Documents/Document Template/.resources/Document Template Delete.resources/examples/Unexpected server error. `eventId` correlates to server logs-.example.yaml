$kind: http-example
name: Unexpected server error. `eventId` correlates to server logs.
request:
  url: "{{baseUrl}}/v1/documents/template/:documentTemplateGuid/delete"
  method: DELETE
  headers:
    Accept: application/json
  pathVariables:
    - key: documentTemplateGuid
      value: 7c9e6679-7425-40de-944b-e07fc1f90ae7
      description: (Required) GUID of the document template to delete.
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "GET_DATA_SOURCE_ERROR",
        "message": "An unexpected error occurred.",
        "eventId": "a1b2c3d4"
      }
order: 5000
