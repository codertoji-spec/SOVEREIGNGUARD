$kind: http-example
name: Unexpected server error. `eventId` correlates to server logs.
request:
  url: "{{baseUrl}}/v1/documents/solution/:documentSolutionGuid/get"
  method: GET
  headers:
    Accept: application/json
  pathVariables:
    - key: documentSolutionGuid
      value: d290f1ee-6c54-4b01-90e6-d701748f0851
      description: (Required) GUID of the document solution.
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "GET_DATA_SOURCE_ERROR",
        "message": "An unexpected error occurred.",
        "eventId": "a1b2c3d4"
      }
order: 5000
