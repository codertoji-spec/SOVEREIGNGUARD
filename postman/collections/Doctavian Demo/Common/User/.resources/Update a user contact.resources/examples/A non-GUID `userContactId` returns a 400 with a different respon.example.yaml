$kind: http-example
name: A non-GUID `userContactId` returns a 400 with a different response shape than the standard error envelope.
request:
  url: "{{baseUrl}}/v1/common/user/contact/:userContactId/update"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  pathVariables:
    - key: userContactId
      value: 312bb9a2-9a08-1229-d383-fc5a85ee4abe
      description: (Required) GUID of the user contact. A non-GUID value returns a 400 with a different response shape than the standard error envelope.
  body:
    type: json
    content: |-
      {
        "name": "Jane Doe",
        "email": "jane.doe@example.com",
        "sharedWithAccount": false
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: "{}"
order: 2000
