$kind: http-example
name: Caller is authenticated but not authorized to perform this action.
request:
  url: "{{baseUrl}}/v1/common/user/contact/:userContactId/get"
  method: GET
  headers:
    Accept: application/json
  pathVariables:
    - key: userContactId
      value: 312bb9a2-9a08-1229-d383-fc5a85ee4abe
      description: (Required) GUID of the user contact. A non-GUID value returns a 400 with a different response shape than the standard error envelope.
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "innerErrors": [
            {
              "code": "VALIDATION_ERROR",
              "message": "Name is required.",
              "userMessage": "Name is required."
            }
          ],
          "message": "One or more validation errors occurred.",
          "statusCode": 400
        },
        "dateTime": "2026-01-01T12:00:00.0000000+00:00",
        "operationId": "00-abc123-00",
        "origin": "self-service-portal"
      }
order: 4000
