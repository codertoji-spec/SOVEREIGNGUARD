$kind: http-example
name: Unexpected server error; the whole batch is rolled back if this occurs.
request:
  url: "{{baseUrl}}/v1/common/settings/update"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "settings": [
          {
            "settingDefinitionId": "3fa85f64-5717-4562-b3fc-2c963f66afa6",
            "settingScopeId": "5a2e7b10-8c3e-4a1a-9e3a-1f2b3c4d5e6f",
