$kind: http-example
name: Unexpected server error.
request:
  url: "{{baseUrl}}/v1/common/summary?type=dashboard"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: type
      value: dashboard
      description: (Required) Matched case-insensitively against `dashboard`/`self-service`. A missing or unrecognized value returns `INVALID_SUMMARY_TYPE` (400). (This can only be one of dashboard,self-service)
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "innerErrors": [
            {
              "code": "FUNCTION_EXECUTION_ERROR",
              "message": "An unexpected error occurred while processing the request.",
              "userMessage": "Something went wrong. Please contact support."
            }
          ],
          "message": "An unexpected error occurred while processing the request.",
          "statusCode": 500
        },
        "dateTime": "2026-01-01T12:00:00.0000000+00:00",
        "operationId": "common-summary",
        "origin": ""
      }
order: 5000
