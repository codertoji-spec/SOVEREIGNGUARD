$kind: http-request
description: Uploads the German-locale contract template (DOCX). Same structure and expressions as Mission 1's template — download it from the Before you begin section of the Mission 3 page. The response's file id is saved automatically.
url: "{{baseUrl}}/v1/documents/template/upload"
method: POST
headers:
  X-Api-Key: "{{doctavianApiKey}}"
body:
  type: formdata
  content:
    - type: file
      key: file
      src: []
      description: Attach mission-3-agreement-de.docx here. Download it from the Before you begin section of the Mission 3 page.
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      const files = json && json.result && json.result.data && json.result.data.files;
      if (files && files.length > 0) {
          pm.collectionVariables.set('mission3.templateId', files[0].id);
      }
    language: text/javascript
order: 3000
